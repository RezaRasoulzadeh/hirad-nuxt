homepage:
  hero:
    title: "Pioneer and Innovator in Supplying Primary Goods"
    subtitle: "Supplier of valves, pipes, fittings, flanges, gaskets, flexible connections, instrumentation, chemical raw materials, and other similar equipment for industrial projects with various technical specifications."
    button: "Contact Experts"
  features:
    title: "Hirad Products"
  about:
    title: "Supply, Production, Import"
    sub_title: "About Hirad Process Equipment Co."
    description: "Hirad Process Equipment Co. was established in 2015 in Tehran (Registration No. 525470) with the aim of supplying, procuring, and providing technical and engineering services and equipment required by the oil, gas, petrochemical, refinery, power plant, manufacturing, food, and pharmaceutical industries. The company always strives to collaborate with reputable global brands and domestic manufacturers to deliver authentic, high-quality, and cost-effective products to its customers. By adhering to international standards (ASMI, ASME, ANSI, API, EN, DIN, BS, ISO), delivering goods in the presence of client representatives, and providing valid product certificates, Hirad Process Equipment Co. is ready to meet the needs of related industries."
    button: "Learn more"
  blog:
    title: "Latest News and Articles"
    sub_title: "Stay updated with the latest information and articles on industrial equipment and processes"
    read_more: "Read more"
  subscription_banner:
    title: "Never Miss an Update"
    description: "Subscribe to receive the latest news, product updates, and expert tips—straight to your inbox."
    button: "Subscribe to Newsletter"
    success_message: "Successfully subscribed!"
    failed_message: "Something went wrong. Please try again."
  certifications:
    title: "Certifications and Standards"
    description: "Hirad Process Equipment Co. ensures the quality and authenticity of its products by adhering to international standards and obtaining reputable certifications."
    button: "View Certifications"
    certificates:
      - name: "ISO 9001"
        description: "Quality Management System"
      - name: "API 6D"
        description: "Industrial Valve Standard"
      - name: "ASME B16.5"
        description: "Flange Standard"
  brand_promise:
    title: "Horad Promise"
    subtitle: "The company's vision is to become a trusted partner for manufacturers and a reliable supplier for customers."
    items:
      - title: "Committed"
        description: "Commitment engenders trust. We stand by our word and are convinced that as a result not only our customers but also everyone we work with can rely on us."
      - title: "Motivated"
        description: "We always strive to find the best solution for our customers. It is our goal and incentive to have completely satisfied customers."
      - title: "Competently"
        description: "Technical and commercial expertise form the basis for developing qualified solutions tailored precisely to the needs of our customers."
      - title: "Flexible"
        description: "We do not adhere to rigid guidelines but instead focus on the individual wishes and needs of our customers. They are more important to us than internal company processes."

footer:
  title: "Tajhiz Farayand Hirad Co."
  description: "Tajhiz Farayand Hirad Co., founded in 2015 in Tehran (Reg. No. 525470), supplies industrial equipment and engineering services to oil, gas, petrochemical, pharmaceutical, food, and energy sectors. The company partners with reputable global brands, adhering to international standards, to deliver high-quality, reliable products at competitive prices."
  links: "Quick Access"
  link_items:
