category:
  application_section:
    title: "کاربردها"
    description: "تجهیزات و خدمات ما در صنایع مختلف از جمله نفت، گاز، پتروشیمی، دارویی و غذایی کاربرد دارند. ما با ارائه راه‌حل‌های تخصصی، به بهبود فرآیندها و افزایش بهره‌وری در این صنایع کمک می‌کنیم."
  ask_for_quote:
    title: "درخواست قیمت"
    description: "اگر نیازهای خاصی دارید یا به راه‌حل سفارشی نیازمندید، لطفاً برای دریافت قیمت با ما تماس بگیرید. تیم ما با خوشحالی آماده پاسخگویی به نیازهای شماست."
    button: "ارتباط با کارشناسان"
  why_choose_us:
    title: "چرا ما را انتخاب کنید؟"
    description: "ما با تکیه بر تجربه، دانش فنی و تعهد به کیفیت، بهترین راه‌حل‌ها را برای مشتریان خود ارائه می‌دهیم. هدف ما رضایت کامل مشتریان و ایجاد روابط بلندمدت است."
    items:
      - title: "تجربه و تخصص"
        description: "تیم ما با سال‌ها تجربه در صنعت، توانایی ارائه راه‌حل‌های دقیق و کارآمد را دارد."
        icon: "smart.png"
      - title: "پشتیبانی قوی"
        description: "ما همواره در کنار مشتریان خود هستیم و آماده پاسخگویی به سوالات و نیازهای آن‌ها هستیم."
        icon: "service.png"
      - title: "کیفیت بالا"
        description: "تمامی محصولات ما با رعایت استانداردهای بین‌المللی تولید و تأمین می‌شوند."
        icon: "quality.png"

