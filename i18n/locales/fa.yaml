homepage:
  hero:
    title: "پیشگام و مبتکر در تامین کالای اولیه"
    subtitle: "تامین کننده شیرآلات لوله، اتصالات، فلنچ، گسکت، اتصالات انعطاف پذیر، ابزار دقیق، مواد اولیه شیـمیایی و  سایر تجهیزات مشابه مصرف طرح ها و پروژه ها صنعتی با مشخصات فنی مختلــف"
    button: "ارتباط با کارشناسان"
  features:
    title: "محصولات هیراد"
  about:
    title: "تأمین، تولید، واردات"
    sub_title: "درباره شرکت تجهیز فرآیند هیراد"
    description: "شرکت تجهیز فرآیند هیراد در سال 1394 در تهران (شماره ثبت 525470) با هدف تأمین، تدارک و ارائه تجهیزات و خدمات فنی-مهندسی مورد نیاز صنایع نفت، گاز، پتروشیمی، پالایشگاه‌ها، نیروگاه‌ها، صنایع تولیدی، غذایی و دارویی تأسیس شد. این شرکت همواره در همکاری با برندهای معتبر جهانی و تولیدکنندگان داخلی تلاش می‌کند تا تجهیزات اصیل، باکیفیت و مقرون‌به‌صرفه را به مشتریان ارائه دهد. تجهیز فرآیند هیراد با رعایت استانداردهای بین‌المللی (ASMI, ASME, ANSI, API, EN, DIN, BS, ISO)، تحویل کالا در حضور نمایندگان و ارائه گواهینامه‌های معتبر (Certificate) آماده پاسخگویی به نیازهای صنایع مرتبط است."
    button: "بیشتر بدانید"
  blog:
    title: "آخرین اخبار و مقالات"
    sub_title: "به‌روزترین اطلاعات و مقالات در زمینه تجهیزات صنعتی و فرآیندها"
    read_more: "بیشتر بخوانید"
  subscription_banner:
    title: "هیچ بروزرسانی‌ای را از دست ندهید"
    description: "با عضویت، جدیدترین اخبار، به‌روزرسانی‌ها و نکات تخصصی را مستقیم در ایمیل خود دریافت کنید."
    button: "عضویت در خبرنامه"
    success_message: "با موفقیت عضو شدید!"
    failed_message: "خطایی رخ داد. لطفا دوباره تلاش کنید."
  certifications:
    title: "گواهینامه‌ها و استانداردها"
    description: "شرکت تجهیز فرآیند هیراد با رعایت استانداردهای بین‌المللی و اخذ گواهینامه‌های معتبر، کیفیت و اصالت محصولات خود را تضمین می‌کند."
    button: "مشاهده گواهینامه‌ها"
    certificates:
      - name: "ISO 9001"
        description: "سیستم مدیریت کیفیت"
      - name: "API 6D"
        description: "استاندارد شیرآلات صنعتی"
      - name: "ASME B16.5"
        description: "استاندارد فلنج‌ها"
  brand_promise:
    title: "تعهد هیراد"
    subtitle: "چشم‌انداز این شرکت تبدیل شدن به همکاری مورد اعتماد برای تولید کنندگان و تامین کننده‌ای مطمئن برای مشتریان می باشد."
    items:
      - title: "متعهد"
        description: "تعهد اعتماد می‌آفریند. ما به قول خود پایبندیم و باور داریم که همین موضوع باعث می‌شود نه‌تنها مشتریان، بلکه تمام همکاران‌مان بتوانند روی ما حساب کنند."
      - title: "انگیزه‌مند"
        description: "ما همیشه تلاش می‌کنیم بهترین راه‌حل را برای مشتریان‌مان پیدا کنیم. هدف ما رضایت کامل آن‌هاست و همین، انگیزه‌ی اصلی ماست."
      - title: "با‌ صلاحیت"
        description: "دانش فنی و بازرگانی پایه‌ای است برای توسعه‌ی راه‌حل‌هایی دقیقاً مطابق با نیازهای مشتریان ما."
      - title: "منعطف"
        description: "ما به دستورالعمل‌های خشک پایبند نیستیم، بلکه تمرکزمان بر خواسته‌ها و نیازهای فردی مشتریان است. آن‌ها برای ما مهم‌تر از فرآیندهای داخلی شرکت هستند."

footer:
  title: "شرکت تجهیز فرآیند هیراد"
  description: "شرکت تجهیز فرآیند هیراد از سال ۱۳۹۴ با شماره ثبت ۵۲۵۴۷۰ در تهران تأسیس شده و در زمینه تأمین و تدارک تجهیزات فنی و صنعتی برای صنایع نفت، گاز، پتروشیمی، نیروگاه‌ها و صنایع دارویی و غذایی فعالیت می‌کند. این شرکت با تکیه بر استانداردهای بین‌المللی و همکاری با برندهای معتبر جهانی، کالاهایی با اصالت و کیفیت را با قیمت مناسب ارائه می‌دهد."
